name: Build Multi ML APK

on:
  push:
    branches:
      - multiml-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" | tail -30 || true
          ls -la "$ANDROID_HOME/build-tools" | tail -30 || true

      - name: Build debug APK
        run: gradle -p multiml assembleDebug --stacktrace

      - name: Stage APK
        run: |
          cp multiml/app/build/outputs/apk/debug/app-debug.apk MultiML-v0.2-debug.apk
          sha256sum MultiML-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiML-v0.2-debug
          path: MultiML-v0.2-debug.apk
          if-no-files-found: error
